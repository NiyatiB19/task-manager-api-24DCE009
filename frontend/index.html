<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <section id="loginPage" class="auth-page">
            <form class="auth-form" onsubmit="loginUser(event)">
                <h1>Login</h1>
                <p class="form-subtitle">Sign in to manage your tasks</p>
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit">Login</button>
                <p id="loginMessage" class="form-message"></p>
                <p class="form-link">Don't have an account? <a href="#" onclick="showPage('registerPage'); return false;">Register</a></p>
            </form>
        </section>

        <section id="registerPage" class="auth-page hidden">
            <form class="auth-form" onsubmit="registerUser(event)">
                <h1>Register</h1>
                <p class="form-subtitle">Create your Task Manager account</p>
                <input type="text" id="registerName" placeholder="Full name" required>
                <input type="email" id="registerEmail" placeholder="Email" required>
                <input type="tel" id="registerPhone" placeholder="Phone number" required>
                <input type="password" id="registerPassword" placeholder="Password" required>
                <button type="submit">Register</button>
                <p id="registerMessage" class="form-message"></p>
                <p class="form-link">Already have an account? <a href="#" onclick="showPage('loginPage'); return false;">Login</a></p>
            </form>
        </section>

        <section id="tasksPage" class="hidden">
            <div class="page-header">
                <h1>My Tasks</h1>
                <button onclick="logoutUser()">Logout</button>
            </div>

            <div class="task-form">

            <input
                type="text"
                id="title"
                placeholder="Enter task title"
            >

            <textarea
                id="description"
                placeholder="Enter task description"
            ></textarea>

            <select id="priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>

            <button onclick="addTask()">Add Task</button>

            </div>

            <div class="tasks-section">

                <h2>My Tasks</h2>

                <div id="taskList">
                    <p>Loading tasks...</p>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
